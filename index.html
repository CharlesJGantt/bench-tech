<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bench Tech</title>
  </head>
  <body>
    <canvas id="app"></canvas>

    <header id="topbar">
      <div class="brand">BENCH<span>TECH</span></div>
      <div id="shop"></div>
      <div class="spacer"></div>
      <label class="toggle"><input type="checkbox" id="guided" /> Guided</label>
      <button data-act="thermal" id="thermal-btn" title="Thermal camera view (T)" style="display:none">🌡 Thermal</button>
      <button data-act="flip" title="Turn the board over to see the underside (B)">⇅ Flip board</button>
      <button data-act="focus" title="Reset camera (F)">⌖ View</button>
      <button data-act="help">? Help</button>
    </header>

    <aside id="left">
      <section id="ticket" class="panel"></section>
      <section id="card" class="panel"></section>
      <section id="log" class="panel"></section>
    </aside>

    <aside id="right">
      <section id="meter" class="panel"></section>
      <section id="scope" class="panel" style="display:none"><h3>Oscilloscope</h3><canvas id="scope-cv" width="520" height="220"></canvas><div id="scope-read"></div></section>
      <section id="power" class="panel">
        <h3>Power</h3>
        <div id="power-modes" class="seg-buttons"></div>
        <div class="psu">
          <div id="psu-read" class="psu-read"></div>
          <div class="psu-set">
            <label>Set V <input id="psu-v" type="number" step="0.1" min="0" max="30" /></label>
            <span class="row tiny"><button data-act="psu-step" data-dv="-1">−1</button><button data-act="psu-step" data-dv="-0.1">−.1</button><button data-act="psu-step" data-dv="0.1">+.1</button><button data-act="psu-step" data-dv="1">+1</button></span>
            <label>Limit A <input id="psu-i" type="number" step="0.05" min="0.01" max="5" /></label>
            <span class="row tiny"><button data-act="psu-step" data-di="-0.1">−.1</button><button data-act="psu-step" data-di="-0.01">−.01</button><button data-act="psu-step" data-di="0.01">+.01</button><button data-act="psu-step" data-di="0.1">+.1</button></span>
          </div>
          <div id="clips"></div>
        </div>
        <div id="lamp-state" class="muted"></div>
        <div id="device-status"></div>
        <div id="controls"></div>
      </section>
    </aside>

    <footer id="bottom">
      <div id="hint"></div>
      <nav id="toolbar"></nav>
    </footer>

    <div id="tip"></div>
    <div id="toast"></div>
    <div id="modal"><div id="modal-body"></div></div>
    <div id="loading">Warming up the soldering iron…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
